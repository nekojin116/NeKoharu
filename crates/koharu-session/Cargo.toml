[package]
name = "koharu-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Peer-to-peer project sessions hosted through a Cloudflare quick tunnel"
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8.4", features = ["ws", "http1"] }
base64.workspace = true
bytes.workspace = true
dirs.workspace = true
futures.workspace = true
koharu-storage.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.27", default-features = false, features = [
    "connect",
    "handshake",
    "native-tls",
] }
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }